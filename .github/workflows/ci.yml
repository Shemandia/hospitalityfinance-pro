name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        # The superuser only creates the application role and the database.
        # The tests connect as hfp, which owns the database but is not a
        # superuser, as in production: a superuser ignores row-level security.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://hfp:hfp_ci@localhost:5432/hfp_test
      # A second tenant database, for the two-tenant isolation tests (WP-A).
      TEST_SECOND_DATABASE_URL: postgresql://hfp:hfp_ci@localhost:5432/hfp_test_b
      # A registry database, for the worker entry-point tests (OPS-10).
      TEST_REGISTRY_DATABASE_URL: postgresql://hfp:hfp_ci@localhost:5432/hfp_registry_test
      # Scratch database for the schema/migrations drift check (WP-2).
      SHADOW_DATABASE_URL: postgresql://hfp:hfp_ci@localhost:5432/hfp_shadow
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-used-outside-this-workflow
      # The API and the workers will not start without these (apps/api/src/config.ts).
      APP_BASE_URL: http://web.ci.invalid
      PLATFORM_API_KEY: ci-only-platform-key-not-used-outside-this-workflow
      # 32 bytes, base64; seals tenant role passwords in the registry (WP-2).
      PLATFORM_ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
      # PgBouncer in transaction mode, for the pooler tests (WP-2, ARC-04).
      TEST_POOLER_HOST: 127.0.0.1
      TEST_POOLER_PORT: "6432"
      TEST_POOLER_POOL_SIZE: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm --filter @hfp/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Test databases are built from empty by the migrations, exactly as
      # provisioning builds a tenant (WP-2, ARC-03).
      - name: Create application role and test databases
        env:
          PGPASSWORD: postgres_ci
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE hfp LOGIN PASSWORD 'hfp_ci' NOSUPERUSER NOBYPASSRLS CREATEDB CREATEROLE" \
            -c "CREATE DATABASE hfp_test OWNER hfp" \
            -c "CREATE DATABASE hfp_test_b OWNER hfp" \
            -c "CREATE DATABASE hfp_registry_test OWNER hfp" \
            -c "CREATE DATABASE hfp_shadow OWNER hfp"

      # The backup tests run pg_dump and pg_restore (WP-2 item 9) of the
      # server's major version (16): the runner's own are newer, and a newer
      # pg_restore cannot restore into an older server. PG_BIN_DIR points the
      # tests at them, as it would on a server.
      - name: PostgreSQL client tools
        env:
          PGPASSWORD: hfp_ci
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo "PG_BIN_DIR=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version
          psql -h localhost -U hfp -d hfp_test -Atc "show server_version"

      # The connection pooler production runs in front of tenant databases
      # (docs/CONNECTION-POOLER.md): transaction mode, prepared statements on,
      # roles authenticated through auth_query so new tenant roles need no file.
      - name: Start PgBouncer
        env:
          PGPASSWORD: hfp_ci
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer
          sudo systemctl stop pgbouncer || true
          mkdir -p /tmp/pgbouncer
          echo '"postgres" "postgres_ci"' > /tmp/pgbouncer/userlist.txt
          cat > /tmp/pgbouncer/pgbouncer.ini <<'INI'
          [databases]
          * = host=localhost port=5432
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          unix_socket_dir =
          pool_mode = transaction
          default_pool_size = 2
          max_client_conn = 500
          max_prepared_statements = 200
          auth_type = scram-sha-256
          auth_file = /tmp/pgbouncer/userlist.txt
          auth_user = postgres
          auth_dbname = postgres
          auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = $1
          ignore_startup_parameters = extra_float_digits,options
          logfile = /tmp/pgbouncer/pgbouncer.log
          pidfile = /tmp/pgbouncer/pgbouncer.pid
          INI
          pgbouncer --version
          pgbouncer -d /tmp/pgbouncer/pgbouncer.ini
          for i in $(seq 1 20); do
            psql -h 127.0.0.1 -p 6432 -U hfp -d hfp_test -Atc "select 'through the pooler'" && exit 0
            sleep 1
          done
          cat /tmp/pgbouncer/pgbouncer.log
          exit 1

      # Fails when a schema.prisma and its migrations disagree.
      - name: Migrations match the schemas
        run: pnpm --filter @hfp/api db:check:migrations

      - name: Prepare test database
        run: pnpm --filter @hfp/api db:setup:test
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Prepare second tenant test database
        run: pnpm --filter @hfp/api db:setup:test
        env:
          DATABASE_URL: ${{ env.TEST_SECOND_DATABASE_URL }}

      - name: Prepare test registry database
        run: pnpm --filter @hfp/api db:migrate:deploy:registry
        env:
          REGISTRY_DATABASE_URL: ${{ env.TEST_REGISTRY_DATABASE_URL }}

      - name: Unit tests
        run: pnpm test

      # Run explicitly so a missing database fails the job instead of skipping.
      # Files in parallel here; locally, test:integration runs them one at a time.
      - name: Integration tests
        run: pnpm --filter @hfp/api test:integration:parallel

      - name: PgBouncer log
        if: failure()
        run: cat /tmp/pgbouncer/pgbouncer.log || true

      - name: Build
        run: pnpm build

      # The built API must start the way production starts it (compiled code,
      # compiled workspace packages, generated clients beside it).
      - name: Built API starts
        working-directory: apps/api
        env:
          NODE_ENV: production
          PORT: "4599"
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REGISTRY_DATABASE_URL: ${{ env.TEST_REGISTRY_DATABASE_URL }}
        run: |
          node --conditions=production dist/index.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4599/health && break; sleep 1; done
          curl -fs http://127.0.0.1:4599/health || { cat api.log; exit 1; }
          kill %1

      # The built worker supervisor must keep its workers running.
      - name: Built workers start
        working-directory: apps/api
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REGISTRY_DATABASE_URL: ${{ env.TEST_REGISTRY_DATABASE_URL }}
          # Required by the workers in production. The schedule is not due during the check.
          BACKUP_DIR: ${{ runner.temp }}/hfp-backups
        run: |
          node --conditions=production dist/jobs/worker-supervisor.js > workers.log 2>&1 &
          sleep 12
          kill -0 %1 || { echo "supervisor exited"; cat workers.log; exit 1; }
          started=$(grep -c 'worker started\|Worker started\|Started;' workers.log || true)
          echo "workers reporting started: $started"
          [ "$started" -ge 6 ] || { cat workers.log; exit 1; }
          kill %1
