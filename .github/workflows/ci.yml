name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        # The superuser only creates the application role and the database.
        # The tests connect as hfp, which owns the database but is not a
        # superuser, as in production: a superuser ignores row-level security.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://hfp:hfp_ci@localhost:5432/hfp_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-used-outside-this-workflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm --filter @hfp/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The tenant migration chain cannot build an empty database yet (OPS-04).
      # Until WP-2 replaces it with a clean baseline, the test database is built
      # the same way provisioning builds a tenant. Replace with `migrate deploy`
      # and add the migrate-from-empty check when WP-2 lands.
      - name: Create application role and test database
        env:
          PGPASSWORD: postgres_ci
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE hfp LOGIN PASSWORD 'hfp_ci' NOSUPERUSER NOBYPASSRLS CREATEDB CREATEROLE" \
            -c "CREATE DATABASE hfp_test OWNER hfp"

      - name: Prepare test database
        run: pnpm --filter @hfp/api db:setup:test
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Unit tests
        run: pnpm test

      # Run explicitly so a missing database fails the job instead of skipping.
      - name: Integration tests
        run: pnpm --filter @hfp/api test:integration

      - name: Build
        run: pnpm build
