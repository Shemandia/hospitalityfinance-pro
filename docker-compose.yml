version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: hfp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hfp_db}
      POSTGRES_USER: ${POSTGRES_USER:-hfp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hfp} -d ${POSTGRES_DB:-hfp_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hfp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hfp-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hfp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  # NOTE: Keycloak was removed — native auth (bcrypt + JWT + Redis sessions)
  # replaced it. No runtime component uses Keycloak.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hfp-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4500:4500"
    environment:
      NODE_ENV: production
      PORT: "4500"
      DATABASE_URL: postgresql://${POSTGRES_USER:-hfp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hfp_db}
      REGISTRY_DATABASE_URL: postgresql://${POSTGRES_USER:-hfp}:${POSTGRES_PASSWORD}@postgres:5432/hfp_registry
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-hfp}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hfp-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://api:4500
    depends_on:
      - api

volumes:
  postgres_data:
