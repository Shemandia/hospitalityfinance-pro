version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: hfp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hfp_db}
      POSTGRES_USER: ${POSTGRES_USER:-hfp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hfp} -d ${POSTGRES_DB:-hfp_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hfp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hfp-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4500:4500"
    environment:
      NODE_ENV: production
      PORT: "4500"
      DATABASE_URL: postgresql://${POSTGRES_USER:-hfp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hfp_db}
      REGISTRY_DATABASE_URL: postgresql://${POSTGRES_USER:-hfp}:${POSTGRES_PASSWORD}@postgres:5432/hfp_registry
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:?Set PLATFORM_API_KEY in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background workers: reports, dunning, scheduled reports and Transfer Desk
  # imports. The API only enqueues; without this service nothing runs (OPS-10).
  workers:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.workers
    container_name: hfp-workers
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hfp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hfp_db}
      REGISTRY_DATABASE_URL: postgresql://${POSTGRES_USER:-hfp}:${POSTGRES_PASSWORD}@postgres:5432/hfp_registry
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hfp-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      # The browser calls the web app; it proxies the API on the internal network.
      API_INTERNAL_URL: http://api:4500
    depends_on:
      - api

volumes:
  postgres_data:
